---
name: "community.zabbix.zabbix_proxy"
on:
  workflow_call:
  push:
    paths:
      - "roles/zabbix_proxy/**"
      - "molecule/zabbix_proxy/**"
      - "molecule/requirements.txt"
      - ".github/workflows/proxy.yml"
      - "roles/zabbix_repo/**"
  pull_request:
    paths:
      - "roles/zabbix_proxy/**"
      - "molecule/zabbix_proxy/**"
      - "molecule/requirements.txt"
      - ".github/workflows/proxy.yml"
      - "roles/zabbix_repo/**"
concurrency:
  group: proxy-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  build-collection:
    uses: ./.github/workflows/build_collection.yml

  molecule:
    needs: build-collection
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: zabbix_proxy
            database: mysql
          - scenario: zabbix_proxy
            database: pgsql
          - scenario: zabbix_proxy
            database: sqlite3
          - scenario: zabbix_proxy_psk
            database: mysql
          - scenario: zabbix_proxy_psk_active
            database: mysql
    uses: ./.github/workflows/role-test.yml
    with:
      role: proxy
      scenario: ${{ matrix.scenario }}
      database: ${{ matrix.database }}

  ci:
    name: CI (proxy)
    if: always()
    needs: [build-collection, molecule]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Coverage scope
        if: always()
        shell: bash
        run: |
          {
            echo "## Coverage scope";
            echo "";
            echo "Full support matrix under test:";
            echo "";
            echo "- Zabbix: 6.0, 7.0, 7.2, 7.4";
            echo "- ansible-core: 2.16 through 2.21 plus devel (each with supported controller Python, up to 3.14)";
            echo "";
            echo "All supported combinations run. Any failures below are the current fix-list (real, fully visible - not hidden).";
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Aggregate matrix result
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
