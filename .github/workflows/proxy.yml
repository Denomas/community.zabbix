---
name: "community.zabbix.zabbix_proxy"
on:
  workflow_call:
  push:
    paths:
      - "roles/zabbix_proxy/**"
      - "molecule/zabbix_proxy/**"
      - "molecule/requirements.txt"
      - ".github/workflows/proxy.yml"
      - "roles/zabbix_repo/**"
  pull_request:
    paths:
      - "roles/zabbix_proxy/**"
      - "molecule/zabbix_proxy/**"
      - "molecule/requirements.txt"
      - ".github/workflows/proxy.yml"
      - "roles/zabbix_repo/**"
concurrency:
  group: proxy-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  build-collection:
    uses: ./.github/workflows/build_collection.yml

  base:
    needs: build-collection
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        container:
          - image: rockylinux10
          - image: rockylinux9
          - image: ubuntu2404
          - image: ubuntu2204
          - image: debian13
          - image: debian12
          - image: debian11
        collection_role:
          - zabbix_proxy
        database:
          - mysql
          - pgsql
          - sqlite3
        version:
          - v74
          - v72
          - v70
          - v60
        command:
          - ""
        exclude:
          - container:
              image: debian13
            version: v72
          - container:
              image: rockylinux10
            version: v72
          - container:
              image: rockylinux10
            version: v70
          - container:
              image: rockylinux10
            version: v60
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
          cache: pip
          cache-dependency-path: molecule/requirements.txt

      - name: Install latest pip
        run: python -m pip install --upgrade pip yq

      - name: Install dependencies
        run: pip install -r molecule/requirements.txt

      - name: Build the collection
        run: |
          yq -yi '
            .dependencies."ansible.windows" = "2.8.0" |
            .dependencies."ansible.netcommon" = "7.2.0" |
            .dependencies."ansible.posix" = "2.0.0" |
            .dependencies."community.general" = "10.5.0" |
            .dependencies."community.mysql" = "3.13.0" |
            .dependencies."community.postgresql" = "3.12.0"
          ' galaxy.yml

          ansible-galaxy collection build -f

      - name: Cache Ansible Galaxy content
        uses: actions/cache@v5
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
            ~/.cache/ansible-compat
          key: ${{ runner.os }}-molecule-galaxy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-molecule-galaxy-

      - name: Install Collections and Roles
        run: |
          ansible-galaxy collection install -f -vvvv  community-zabbix-*.tar.gz

      - name: Run role tests
        id: run
        env:
          ANSIBLE_CALLBACKS_ENABLED: ansible.builtin.junit
          JUNIT_OUTPUT_DIR: ${{ github.workspace }}/junit
        run: >-
          MY_MOLECULE_CONTAINER=${{ matrix.container.image }}
          MY_MOLECULE_IMAGE=${{ matrix.container.image }}
          MY_MOLECULE_VERSION=${{ matrix.version }}
          MY_MOLECULE_DATABASE=${{ matrix.database }}
          MY_MOLECULE_DOCKER_COMMAND=${{ matrix.command }}
          molecule test -s ${{ matrix.collection_role }}

      - name: Publish test results
        if: always()
        uses: ./.github/actions/publish-test-results
        with:
          junit-path: junit/*.xml
          artifact-name: junit-proxy-base-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.database }}
          check-name: JUnit proxy base ${{ matrix.container.image }} ${{ matrix.version }} ${{ matrix.database }}

      - name: Upload failure logs
        if: failure()
        uses: ./.github/actions/upload-failure-logs
        with:
          artifact-name: logs-proxy-base-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.database }}
          paths: |
            junit/
            ~/.cache/molecule/

      - name: Report result
        if: always()
        uses: ./.github/actions/report-result
        with:
          outcome: ${{ steps.run.outcome }}
          container: ${{ matrix.container.image }}
          zabbix: ${{ matrix.version }}
          database: ${{ matrix.database }}

  psk:
    needs: build-collection
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        container:
          - image: rockylinux9
          - image: ubuntu2204
          - image: debian11
        collection_role:
          - zabbix_proxy_psk
          - zabbix_proxy_psk_active
        database:
          - mysql
        version:
          - v74
          - v72
          - v70
          - v60
        command:
          - ""

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
          cache: pip
          cache-dependency-path: molecule/requirements.txt

      - name: Install latest pip
        run: python -m pip install --upgrade pip yq

      - name: Install dependencies
        run: pip install -r molecule/requirements.txt

      - name: Build the collection
        run: |
          yq -yi '
            .dependencies."ansible.windows" = "2.8.0" |
            .dependencies."ansible.netcommon" = "7.2.0" |
            .dependencies."ansible.posix" = "2.0.0" |
            .dependencies."community.general" = "10.5.0" |
            .dependencies."community.mysql" = "3.13.0" |
            .dependencies."community.postgresql" = "3.12.0"
          ' galaxy.yml

          ansible-galaxy collection build -f

      - name: Cache Ansible Galaxy content
        uses: actions/cache@v5
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
            ~/.cache/ansible-compat
          key: ${{ runner.os }}-molecule-galaxy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-molecule-galaxy-

      - name: Install Collections and Roles
        run: |
          ansible-galaxy collection install -f -vvvv  community-zabbix-*.tar.gz

      - name: Run role tests
        id: run
        env:
          ANSIBLE_CALLBACKS_ENABLED: ansible.builtin.junit
          JUNIT_OUTPUT_DIR: ${{ github.workspace }}/junit
        run: >-
          MY_MOLECULE_CONTAINER=${{ matrix.container.image }}
          MY_MOLECULE_IMAGE=${{ matrix.container.image }}
          MY_MOLECULE_VERSION=${{ matrix.version }}
          MY_MOLECULE_DATABASE=${{ matrix.database }}
          MY_MOLECULE_DOCKER_COMMAND=${{ matrix.command }}
          molecule test -s ${{ matrix.collection_role }}

      - name: Publish test results
        if: always()
        uses: ./.github/actions/publish-test-results
        with:
          junit-path: junit/*.xml
          artifact-name: junit-proxy-psk-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.collection_role }}
          check-name: JUnit proxy psk ${{ matrix.container.image }} ${{ matrix.version }} ${{ matrix.collection_role }}

      - name: Upload failure logs
        if: failure()
        uses: ./.github/actions/upload-failure-logs
        with:
          artifact-name: logs-proxy-psk-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.collection_role }}
          paths: |
            junit/
            ~/.cache/molecule/

      - name: Report result
        if: always()
        uses: ./.github/actions/report-result
        with:
          outcome: ${{ steps.run.outcome }}
          container: ${{ matrix.container.image }}
          zabbix: ${{ matrix.version }}
          database: ${{ matrix.database }}
          scenario: ${{ matrix.collection_role }}

  legacy:
    needs: build-collection
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        container:
          - image: rockylinux8
            ansible_core: ansible-core<2.17
          - image: opensuseleap15
            ansible_core: ansible-core<2.17
        collection_role:
          - zabbix_proxy
          - zabbix_proxy_psk
          - zabbix_proxy_psk_active
        database:
          - mysql
          - pgsql
          - sqlite3
        version:
          - v74
          - v72
          - v70
          - v60
        command:
          - ""
        exclude:
          - collection_role: zabbix_proxy_psk
            database: pgsql
          - collection_role: zabbix_proxy_psk
            database: sqlite3
          - collection_role: zabbix_proxy_psk_active
            database: pgsql
          - collection_role: zabbix_proxy_psk_active
            database: sqlite3
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install latest pip
        run: python -m pip install --upgrade pip yq

      - name: Cache Ansible Galaxy content
        uses: actions/cache@v5
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
            ~/.cache/ansible-compat
          key: ${{ runner.os }}-molecule-galaxy-${{ hashFiles('molecule/requirements.txt', 'molecule/zabbix_agent_tests/common/collections.yml') }}
          restore-keys: |
            ${{ runner.os }}-molecule-galaxy-

      - name: Install specific version ansible-core
        if: matrix.container.ansible_core != null
        run: pip install "${{ matrix.container.ansible_core }}"

      - name: Install dependencies
        run: pip install -r molecule/requirements.txt

      - name: Build the collection
        run: |
          yq -yi '
            .dependencies."ansible.windows" = "2.8.0" |
            .dependencies."ansible.netcommon" = "7.2.0" |
            .dependencies."ansible.posix" = "2.0.0" |
            .dependencies."community.general" = "10.5.0" |
            .dependencies."community.mysql" = "3.13.0" |
            .dependencies."community.postgresql" = "3.12.0"
          ' galaxy.yml

          ansible-galaxy collection build -f

      - name: Cache Ansible Galaxy content
        uses: actions/cache@v5
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
            ~/.cache/ansible-compat
          key: ${{ runner.os }}-molecule-galaxy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-molecule-galaxy-

      - name: Install Collections and Roles
        run: |
          ansible-galaxy collection install -f -vvvv  community-zabbix-*.tar.gz

      - name: Run role tests
        id: run
        env:
          ANSIBLE_CALLBACKS_ENABLED: ansible.builtin.junit
          JUNIT_OUTPUT_DIR: ${{ github.workspace }}/junit
        run: >-
          MY_MOLECULE_CONTAINER=${{ matrix.container.image }}
          MY_MOLECULE_IMAGE=${{ matrix.container.image }}
          MY_MOLECULE_VERSION=${{ matrix.version }}
          MY_MOLECULE_DATABASE=${{ matrix.database }}
          MY_MOLECULE_DOCKER_COMMAND=${{ matrix.command }}
          molecule test -s ${{ matrix.collection_role }}

      - name: Publish test results
        if: always()
        uses: ./.github/actions/publish-test-results
        with:
          junit-path: junit/*.xml
          artifact-name: junit-proxy-legacy-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.collection_role }}-${{ matrix.database }}
          check-name: JUnit proxy legacy ${{ matrix.container.image }} ${{ matrix.version }} ${{ matrix.collection_role }} ${{ matrix.database }}

      - name: Upload failure logs
        if: failure()
        uses: ./.github/actions/upload-failure-logs
        with:
          artifact-name: logs-proxy-legacy-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.collection_role }}-${{ matrix.database }}
          paths: |
            junit/
            ~/.cache/molecule/

      - name: Report result
        if: always()
        uses: ./.github/actions/report-result
        with:
          outcome: ${{ steps.run.outcome }}
          container: ${{ matrix.container.image }}
          zabbix: ${{ matrix.version }}
          database: ${{ matrix.database }}

  ci:
    name: CI (proxy)
    if: always()
    needs: [build-collection, base, psk, legacy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Coverage scope
        if: always()
        shell: bash
        run: |
          {
            echo "## Coverage scope";
            echo "";
            echo "Full support matrix under test:";
            echo "";
            echo "- Zabbix: 6.0, 7.0, 7.2, 7.4";
            echo "- ansible-core: 2.16 through 2.21 plus devel (each with supported controller Python, up to 3.14)";
            echo "";
            echo "All supported combinations run. Any failures below are the current fix-list (real, fully visible - not hidden).";
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Aggregate matrix result
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
