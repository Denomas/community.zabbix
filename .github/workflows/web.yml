---
name: "community.zabbix.zabbix_web"
on:
  workflow_call:
  push:
    paths:
      - "roles/zabbix_web/**"
      - "molecule/zabbix_web/**"
      - "molecule/requirements.txt"
      - ".github/workflows/web.yml"
      - "roles/zabbix_repo/**"
  pull_request:
    paths:
      - "roles/zabbix_web/**"
      - "molecule/zabbix_web/**"
      - "molecule/requirements.txt"
      - ".github/workflows/web.yml"
      - "roles/zabbix_repo/**"
concurrency:
  group: web-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  build-collection:
    uses: ./.github/workflows/build_collection.yml

  molecule:
    needs: build-collection
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        container:
          - image: rockylinux10
          - image: rockylinux9
          - image: ubuntu2404
          - image: ubuntu2204
          - image: debian13
          - image: debian12
          - image: debian11
        collection_role:
          - zabbix_web
        database:
          - mysql
          - pgsql
        web_server:
          - nginx
          - apache
        version:
          # - v74  # TEMP Phase-1 (D23): re-enable in Phase 2
          - v72
          - v70
          - v60
        command:
          - ""
        exclude:
          - container:
              image: rockylinux10
            version: v72
          - container:
              image: rockylinux10
            version: v70
          - container:
              image: rockylinux10
            version: v60
          - container:
              image: debian13
            version: v72
          # - container:  # exclude was for v74 (commented out in Phase 1)
          #     image: debian11
          #   version: v74
          - container:
              image: debian11
            version: v72
          - container:
              image: debian11
            version: v70
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
          cache: pip
          cache-dependency-path: molecule/requirements.txt

      - name: Install latest pip
        run: python -m pip install --upgrade pip yq

      - name: Install dependencies
        run: pip install -r molecule/requirements.txt

      - name: Build the collection
        run: |
          yq -yi '
            .dependencies."ansible.windows" = "2.8.0" |
            .dependencies."ansible.netcommon" = "7.2.0" |
            .dependencies."ansible.posix" = "2.0.0" |
            .dependencies."community.general" = "10.5.0" |
            .dependencies."community.mysql" = "3.13.0" |
            .dependencies."community.postgresql" = "3.12.0"
          ' galaxy.yml

          ansible-galaxy collection build -f

      - name: Cache Ansible Galaxy content
        uses: actions/cache@v5
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
            ~/.cache/ansible-compat
          key: ${{ runner.os }}-molecule-galaxy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-molecule-galaxy-

      - name: Install Collections and Roles
        run: |
          ansible-galaxy collection install -f -vvvv  community-zabbix-*.tar.gz

      - name: Run role tests
        id: run
        env:
          ANSIBLE_CALLBACKS_ENABLED: ansible.builtin.junit
          JUNIT_OUTPUT_DIR: ${{ github.workspace }}/junit
        run: >-
          MY_MOLECULE_CONTAINER=${{ matrix.container.image }}
          MY_MOLECULE_IMAGE=${{ matrix.container.image }}
          MY_MOLECULE_VERSION=${{ matrix.version }}
          MY_MOLECULE_DATABASE=${{ matrix.database }}
          MY_MOLECULE_WEB_SERVER=${{ matrix.web_server }}
          MY_MOLECULE_DOCKER_COMMAND=${{ matrix.command }}
          molecule test -s ${{ matrix.collection_role }}

      - name: Publish test results
        if: always()
        uses: ./.github/actions/publish-test-results
        with:
          junit-path: junit/*.xml
          artifact-name: junit-web-molecule-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.database }}-${{ matrix.web_server }}
          check-name: JUnit web molecule ${{ matrix.container.image }} ${{ matrix.version }} ${{ matrix.database }} ${{ matrix.web_server }}

      - name: Upload failure logs
        if: failure()
        uses: ./.github/actions/upload-failure-logs
        with:
          artifact-name: logs-web-molecule-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.database }}-${{ matrix.web_server }}
          paths: |
            junit/
            ~/.cache/molecule/

      - name: Report result
        if: always()
        uses: ./.github/actions/report-result
        with:
          outcome: ${{ steps.run.outcome }}
          container: ${{ matrix.container.image }}
          zabbix: ${{ matrix.version }}
          database: ${{ matrix.database }}

  legacy:
    needs: build-collection
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        container:
          - image: rockylinux8
            ansible_core: ansible-core<2.17
          - image: opensuseleap15
            ansible_core: ansible-core<2.17
        collection_role:
          - zabbix_web
        database:
          - mysql
          - pgsql
        web_server:
          - nginx
          - apache
        version:
          # - v74  # TEMP Phase-1 (D23): re-enable in Phase 2
          - v72
          - v70
          - v60
        command:
          - ""
        exclude:
          - container:
              image: opensuseleap15
            version: v72
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install latest pip
        run: python -m pip install --upgrade pip yq

      - name: Cache Ansible Galaxy content
        uses: actions/cache@v5
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
            ~/.cache/ansible-compat
          key: ${{ runner.os }}-molecule-galaxy-${{ hashFiles('molecule/requirements.txt', 'molecule/zabbix_agent_tests/common/collections.yml') }}
          restore-keys: |
            ${{ runner.os }}-molecule-galaxy-

      - name: Install specific version ansible-core
        if: matrix.container.ansible_core != null
        run: pip install "${{ matrix.container.ansible_core }}"

      - name: Install dependencies
        run: pip install -r molecule/requirements.txt

      - name: Build the collection
        run: |
          yq -yi '
            .dependencies."ansible.windows" = "2.8.0" |
            .dependencies."ansible.netcommon" = "7.2.0" |
            .dependencies."ansible.posix" = "2.0.0" |
            .dependencies."community.general" = "10.5.0" |
            .dependencies."community.mysql" = "3.13.0" |
            .dependencies."community.postgresql" = "3.12.0"
          ' galaxy.yml

          ansible-galaxy collection build -f

      - name: Cache Ansible Galaxy content
        uses: actions/cache@v5
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
            ~/.cache/ansible-compat
          key: ${{ runner.os }}-molecule-galaxy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-molecule-galaxy-

      - name: Install Collections and Roles
        run: |
          ansible-galaxy collection install -f -vvvv  community-zabbix-*.tar.gz

      - name: Run role tests
        id: run
        env:
          ANSIBLE_CALLBACKS_ENABLED: ansible.builtin.junit
          JUNIT_OUTPUT_DIR: ${{ github.workspace }}/junit
        run: >-
          MY_MOLECULE_CONTAINER=${{ matrix.container.image }}
          MY_MOLECULE_IMAGE=${{ matrix.container.image }}
          MY_MOLECULE_VERSION=${{ matrix.version }}
          MY_MOLECULE_DATABASE=${{ matrix.database }}
          MY_MOLECULE_WEB_SERVER=${{ matrix.web_server }}
          MY_MOLECULE_DOCKER_COMMAND=${{ matrix.command }}
          molecule test -s ${{ matrix.collection_role }}

      - name: Publish test results
        if: always()
        uses: ./.github/actions/publish-test-results
        with:
          junit-path: junit/*.xml
          artifact-name: junit-web-legacy-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.database }}-${{ matrix.web_server }}
          check-name: JUnit web legacy ${{ matrix.container.image }} ${{ matrix.version }} ${{ matrix.database }} ${{ matrix.web_server }}

      - name: Upload failure logs
        if: failure()
        uses: ./.github/actions/upload-failure-logs
        with:
          artifact-name: logs-web-legacy-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.database }}-${{ matrix.web_server }}
          paths: |
            junit/
            ~/.cache/molecule/

      - name: Report result
        if: always()
        uses: ./.github/actions/report-result
        with:
          outcome: ${{ steps.run.outcome }}
          container: ${{ matrix.container.image }}
          zabbix: ${{ matrix.version }}
          database: ${{ matrix.database }}

  ci:
    name: CI (web)
    if: always()
    needs: [build-collection, molecule, legacy]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate matrix result
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
