---
name: "community.zabbix.zabbix_agent"
on:
  workflow_call:
  push:
    paths:
      - "roles/zabbix_agent/**"
      - "molecule/zabbix_agent/**"
      - "molecule/requirements.txt"
      - ".github/workflows/agent.yml"
      - "roles/zabbix_repo/**"
  pull_request:
    paths:
      - "roles/zabbix_agent/**"
      - "molecule/zabbix_agent/**"
      - "molecule/requirements.txt"
      - ".github/workflows/agent.yml"
      - "roles/zabbix_repo/**"
concurrency:
  group: agent-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  build-collection:
    uses: ./.github/workflows/build_collection.yml

  base:
    needs: build-collection
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        container:
          - image: rockylinux10
          - image: rockylinux9
          - image: ubuntu2404
          - image: ubuntu2204
          - image: debian13
          - image: debian12
          - image: debian11
        version:
          # - v74  # TEMP Phase-1 (D23): re-enable in Phase 2
          - v72
          - v70
          - v60
        scenario_name:
          - default
          - agent2
        command:
          - ""
        exclude:
          - container:
              image: debian13
            version: v72
          - container:
              image: rockylinux10
            version: v72
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
          cache: pip
          cache-dependency-path: molecule/requirements.txt

      - name: Install latest pip
        run: python -m pip install --upgrade pip yq

      - name: Install dependencies
        run: pip install -r molecule/requirements.txt

      - name: Build the collection
        run: |
          yq -yi '
            .dependencies."ansible.windows" = "2.8.0" |
            .dependencies."ansible.netcommon" = "7.2.0" |
            .dependencies."ansible.posix" = "2.0.0" |
            .dependencies."community.general" = "10.5.0" |
            .dependencies."community.mysql" = "3.13.0" |
            .dependencies."community.postgresql" = "3.12.0"
          ' galaxy.yml

          ansible-galaxy collection build -f

      - name: Cache Ansible Galaxy content
        uses: actions/cache@v5
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
            ~/.cache/ansible-compat
          key: ${{ runner.os }}-molecule-galaxy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-molecule-galaxy-

      - name: Install Collections and Roles
        run: |
          ansible-galaxy collection install -f -vvvv  community-zabbix-*.tar.gz

      - name: Run role tests
        id: run
        working-directory: molecule/zabbix_agent_tests
        env:
          ANSIBLE_CALLBACKS_ENABLED: ansible.builtin.junit
          JUNIT_OUTPUT_DIR: ${{ github.workspace }}/junit
        run: >-
          MY_MOLECULE_CONTAINER=${{ matrix.container.image }}
          MY_MOLECULE_IMAGE=${{ matrix.container.image }}
          MY_MOLECULE_VERSION=${{ matrix.version }}
          MY_MOLECULE_DOCKER_COMMAND=${{ matrix.command }}
          molecule -c common/molecule.yml test -s ${{ matrix.scenario_name }}

      - name: Publish test results
        if: always()
        uses: ./.github/actions/publish-test-results
        with:
          junit-path: junit/*.xml
          artifact-name: junit-agent-base-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.scenario_name }}
          check-name: JUnit agent base ${{ matrix.container.image }} ${{ matrix.version }} ${{ matrix.scenario_name }}

      - name: Upload failure logs
        if: failure()
        uses: ./.github/actions/upload-failure-logs
        with:
          artifact-name: logs-agent-base-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.scenario_name }}
          paths: |
            junit/
            ~/.cache/molecule/

      - name: Report result
        if: always()
        uses: ./.github/actions/report-result
        with:
          outcome: ${{ steps.run.outcome }}
          scenario: ${{ matrix.scenario_name }}
          container: ${{ matrix.container.image }}
          zabbix: ${{ matrix.version }}

  psk:
    needs: build-collection
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        container:
          - image: rockylinux10
          - image: rockylinux9
          - image: ubuntu2404
          - image: ubuntu2204
          - image: debian13
          - image: debian12
          - image: debian11
        version:
          # - v74  # TEMP Phase-1 (D23): re-enable in Phase 2
          - v72
          - v70
          - v60
        scenario_name:
          - autopsk
          - agent2autopsk
        command:
          - ""
        exclude:
          - container:
              image: debian13
            version: v72
          - container:
              image: rockylinux10
            version: v72
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
          cache: pip
          cache-dependency-path: molecule/requirements.txt

      - name: Install latest pip
        run: python -m pip install --upgrade pip yq

      - name: Install dependencies
        run: pip install -r molecule/requirements.txt

      - name: Build the collection
        run: |
          yq -yi '
            .dependencies."ansible.windows" = "2.8.0" |
            .dependencies."ansible.netcommon" = "7.2.0" |
            .dependencies."ansible.posix" = "2.0.0" |
            .dependencies."community.general" = "10.5.0" |
            .dependencies."community.mysql" = "3.13.0" |
            .dependencies."community.postgresql" = "3.12.0"
          ' galaxy.yml

          ansible-galaxy collection build -f

      - name: Cache Ansible Galaxy content
        uses: actions/cache@v5
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
            ~/.cache/ansible-compat
          key: ${{ runner.os }}-molecule-galaxy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-molecule-galaxy-

      - name: Install Collections and Roles
        run: |
          ansible-galaxy collection install -f -vvvv  community-zabbix-*.tar.gz

      - name: Run role tests
        id: run
        working-directory: molecule/zabbix_agent_tests
        env:
          ANSIBLE_CALLBACKS_ENABLED: ansible.builtin.junit
          JUNIT_OUTPUT_DIR: ${{ github.workspace }}/junit
        run: >-
          MY_MOLECULE_CONTAINER=${{ matrix.container.image }}
          MY_MOLECULE_IMAGE=${{ matrix.container.image }}
          MY_MOLECULE_VERSION=${{ matrix.version }}
          MY_MOLECULE_DOCKER_COMMAND=${{ matrix.command }}
          molecule -c common/molecule.yml test -s ${{ matrix.scenario_name }}

      - name: Publish test results
        if: always()
        uses: ./.github/actions/publish-test-results
        with:
          junit-path: junit/*.xml
          artifact-name: junit-agent-psk-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.scenario_name }}
          check-name: JUnit agent psk ${{ matrix.container.image }} ${{ matrix.version }} ${{ matrix.scenario_name }}

      - name: Upload failure logs
        if: failure()
        uses: ./.github/actions/upload-failure-logs
        with:
          artifact-name: logs-agent-psk-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.scenario_name }}
          paths: |
            junit/
            ~/.cache/molecule/

      - name: Report result
        if: always()
        uses: ./.github/actions/report-result
        with:
          outcome: ${{ steps.run.outcome }}
          scenario: ${{ matrix.scenario_name }}
          container: ${{ matrix.container.image }}
          zabbix: ${{ matrix.version }}

  legacy:
    needs: build-collection
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        container:
          - image: rockylinux8
            ansible_core: ansible-core<2.17
          - image: opensuseleap15
            ansible_core: ansible-core<2.17
        version:
          # - v74  # TEMP Phase-1 (D23): re-enable in Phase 2
          - v72
          - v70
          - v60
        scenario_name:
          - default
          - agent2
          - autopsk
          - agent2autopsk
        command:
          - ""
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install latest pip
        run: python -m pip install --upgrade pip yq

      - name: Cache Ansible Galaxy content
        uses: actions/cache@v5
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
            ~/.cache/ansible-compat
          key: ${{ runner.os }}-molecule-galaxy-${{ hashFiles('molecule/requirements.txt', 'molecule/zabbix_agent_tests/common/collections.yml') }}
          restore-keys: |
            ${{ runner.os }}-molecule-galaxy-

      - name: Install specific version ansible-core
        if: matrix.container.ansible_core != null
        run: pip install "${{ matrix.container.ansible_core }}"

      - name: Install dependencies
        run: pip install -r molecule/requirements.txt

      - name: Build the collection
        run: |
          yq -yi '
            .dependencies."ansible.windows" = "2.8.0" |
            .dependencies."ansible.netcommon" = "7.2.0" |
            .dependencies."ansible.posix" = "2.0.0" |
            .dependencies."community.general" = "10.5.0" |
            .dependencies."community.mysql" = "3.13.0" |
            .dependencies."community.postgresql" = "3.12.0"
          ' galaxy.yml

          ansible-galaxy collection build -f

      - name: Cache Ansible Galaxy content
        uses: actions/cache@v5
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
            ~/.cache/ansible-compat
          key: ${{ runner.os }}-molecule-galaxy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-molecule-galaxy-

      - name: Install Collections and Roles
        run: |
          ansible-galaxy collection install -f -vvvv  community-zabbix-*.tar.gz

      - name: Run role tests
        id: run
        working-directory: molecule/zabbix_agent_tests
        env:
          ANSIBLE_CALLBACKS_ENABLED: ansible.builtin.junit
          JUNIT_OUTPUT_DIR: ${{ github.workspace }}/junit
        run: >-
          MY_MOLECULE_CONTAINER=${{ matrix.container.image }}
          MY_MOLECULE_IMAGE=${{ matrix.container.image }}
          MY_MOLECULE_VERSION=${{ matrix.version }}
          MY_MOLECULE_DOCKER_COMMAND=${{ matrix.command }}
          molecule -c common/molecule.yml test -s ${{ matrix.scenario_name }}

      - name: Publish test results
        if: always()
        uses: ./.github/actions/publish-test-results
        with:
          junit-path: junit/*.xml
          artifact-name: junit-agent-legacy-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.scenario_name }}
          check-name: JUnit agent legacy ${{ matrix.container.image }} ${{ matrix.version }} ${{ matrix.scenario_name }}

      - name: Upload failure logs
        if: failure()
        uses: ./.github/actions/upload-failure-logs
        with:
          artifact-name: logs-agent-legacy-${{ matrix.container.image }}-${{ matrix.version }}-${{ matrix.scenario_name }}
          paths: |
            junit/
            ~/.cache/molecule/

      - name: Report result
        if: always()
        uses: ./.github/actions/report-result
        with:
          outcome: ${{ steps.run.outcome }}
          scenario: ${{ matrix.scenario_name }}
          container: ${{ matrix.container.image }}
          zabbix: ${{ matrix.version }}

  ci:
    name: CI (agent)
    if: always()
    needs: [build-collection, base, psk, legacy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Coverage scope
        if: always()
        shell: bash
        run: |
          {
            echo "## Phase 1 coverage scope";
            echo "";
            echo "This run exercises the currently-supported, already-passing versions.";
            echo "";
            echo "- Zabbix: 6.0, 7.0, 7.2";
            echo "- ansible-core: 2.16 through 2.21 (paired with supported controller Python <= 3.13)";
            echo "";
            echo "Temporarily disabled (commented, re-enabled in Phase 2 - see DECISIONS D23): Zabbix 7.4, ansible-core devel, Python 3.14.";
            echo "Nothing is silently dropped; disabled cells are visible as commented matrix entries.";
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Aggregate matrix result
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
