---
name: repo-sanity
on:
  workflow_call:
  push:
  pull_request:
concurrency:
  group: sanity-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tox-linters:
    name: Tox-Lint (py${{ matrix.python }})
    timeout-minutes: 30
    strategy:
      matrix:
        python:
          - '3.12'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          path: ansible_collections/community/zabbix

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: pip install flake8 tox

      - name: Run lint test for py3
        id: run
        run: tox -elinters-py3 -vv
        working-directory: ./ansible_collections/community/zabbix

      - name: Report result
        if: always()
        uses: ./ansible_collections/community/zabbix/.github/actions/report-result
        with:
          outcome: ${{ steps.run.outcome }}
          scenario: tox-lint
          python: py${{ matrix.python }}

  sanity:
    name: Sanity (Ⓐ${{ matrix.ansible }}+py${{ matrix.python }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Newest first (fast feedback), then older releases retroactively, each paired with a
        # supported controller Python. devel = next stable (Python >= 3.13).
        # https://docs.ansible.com/projects/ansible/latest/reference_appendices/release_and_maintenance.html#ansible-core-changelogs
        include:
          # TEMP Phase-1 (D23): re-enable in Phase 2
          # - ansible: devel
          #   python: '3.13'
          - ansible: stable-2.21
            python: '3.13'
          - ansible: stable-2.20
            python: '3.13'
          - ansible: stable-2.19
            python: '3.12'
          - ansible: stable-2.18
            python: '3.12'
          - ansible: stable-2.17
            python: '3.12'
          - ansible: stable-2.16
            python: '3.12'
    runs-on: ubuntu-latest
    steps:
      # ansible-test requires the collection to be in a directory in the form
      # .../ansible_collections/NAMESPACE/COLLECTION_NAME/

      - name: Check out code
        uses: actions/checkout@v6
        with:
          path: ansible_collections/community/zabbix

      - name: Set up Python ${{ matrix.ansible }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Install the head of the given branch (devel, stable-2.10)
      - name: Install ansible-base (${{ matrix.ansible }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz --disable-pip-version-check

      # run ansible-test sanity inside of Docker.
      # The docker container has all the pinned dependencies that are required.
      # Explicity specify the version of Python we want to test
      - name: Run sanity tests
        id: run
        run: ansible-test sanity --docker -v --color --exclude molecule/ --python ${{ matrix.python }}
        working-directory: ./ansible_collections/community/zabbix

      - name: Report result
        if: always()
        uses: ./ansible_collections/community/zabbix/.github/actions/report-result
        with:
          outcome: ${{ steps.run.outcome }}
          scenario: sanity
          ansible: ${{ matrix.ansible }}
          python: py${{ matrix.python }}

  ci:
    name: CI (sanity)
    if: always()
    needs: [tox-linters, sanity]
    runs-on: ubuntu-latest
    steps:
      - name: Coverage scope
        if: always()
        shell: bash
        run: |
          {
            echo "## Phase 1 coverage scope";
            echo "";
            echo "Sanity + lint across ansible-core 2.16 through 2.21.";
            echo "";
            echo "Temporarily disabled (commented, re-enabled in Phase 2 - see DECISIONS D23): ansible-core devel.";
            echo "Nothing is silently dropped; disabled cells are visible as commented matrix entries.";
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Aggregate matrix result
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
