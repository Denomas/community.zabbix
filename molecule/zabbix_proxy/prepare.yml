---
- name: Prepare
  hosts: all

  tasks:
    # To prevent services from starting during package installations on a docker build,
    # images normally come with this set to exit 101.
    - name: "Allow services to start on install"
      ansible.builtin.copy:
        content: |
          exit 0
        dest: /usr/sbin/policy-rc.d
      when: ansible_facts['os_family'] == 'Debian'

    # EL aarch64 geerlingguy base images ship the EPEL repo and key file but do not import the key
    # into the rpmdb, so the ansible dnf module fails GPG validation on EPEL dependencies such as
    # fping (pulled in by zabbix-proxy). Import it up front; idempotent and skipped where absent.
    - name: "Stat EPEL GPG key (EL)"
      ansible.builtin.stat:
        path: "/etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-{{ ansible_facts['distribution_major_version'] }}"
      register: _epel_gpg_key
      when: ansible_facts['os_family'] == 'RedHat'

    - name: "Import EPEL GPG key (EL base-image workaround)"
      ansible.builtin.rpm_key:
        state: present
        key: "/etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-{{ ansible_facts['distribution_major_version'] }}"
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - _epel_gpg_key.stat is defined and _epel_gpg_key.stat.exists

    - name: "Installing packages"
      ansible.builtin.package:
        name: "{{ _packages | select | list }}"
        update_cache: "{{ (ansible_facts['os_family'] in ['Debian', 'Suse']) | ternary(true, omit) }}"
      vars:
        _py3_rpm: "python3{% if ansible_facts.python.version.minor != 6 %}{{ ansible_facts.python.version.minor }}{% endif %}-rpm"
        _packages:
          - sudo
          - "{{ (ansible_facts['os_family'] == 'Suse') | ternary(_py3_rpm, '') }}"
      register: installation_dependencies
      until: installation_dependencies is succeeded

    - name: "Configure SUDO."
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        line: "Defaults    !requiretty"
        state: present

    - name: "Workaround for mysql on Debian-13"
      when:
        - ansible_facts.distribution == "Debian"
        - ansible_facts.distribution_major_version == "13"
        - "'mysql' in group_names"
      copy:
        dest: /root/.my.cnf
        content: |
          [client]
          skip-ssl = true
        mode: '0600'
